name: Build CashCalc APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json', 'twa-manifest.json']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" 2>&1 | tail -5

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.12.0

      - name: Restore keystore
        run: |
          echo "" | base64 -d > cashcalc.keystore

      - name: Configure Bubblewrap
        run: |
          mkdir -p $HOME/.bubblewrap
          cat > $HOME/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

      - name: Install expect
        run: sudo apt-get install -y expect

      - name: Serve icons locally for bubblewrap
        run: |
          python3 -m http.server 8080 &
          sleep 2
          # Verify icons are accessible
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/icons/icon-512.png)
          echo "icon-512.png HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "ERROR: icon not accessible"; exit 1; }

      - name: Generate Android project
        run: |
          # bubblewrap downloads iconUrl to generate Android icon resources.
          # Redirect to localhost so it gets the real PNG (not a network error page).
          python3 << 'PYEOF'
          import json
          with open('twa-manifest.json') as f:
              m = json.load(f)
          for k in ['iconUrl', 'maskableIconUrl', 'monochromeIconUrl']:
              if k in m:
                  m[k] = m[k].replace(
                      'https://lohitkumard.github.io/Cash-info',
                      'http://localhost:8080'
                  )
          with open('twa-manifest.json', 'w') as f:
              json.dump(m, f, indent=2)
          print("Icon URLs redirected to localhost")
          PYEOF
          printf 'Y\n' | bubblewrap update 2>&1
          git checkout twa-manifest.json

      - name: Build APK
        run: |
          expect << 'EXPECT_EOF'
          set timeout 600
          log_user 1
          spawn bubblewrap build --skipPwaValidation --manifest ./twa-manifest.json
          expect {
            "Password for" { send "cashcalc2026\r"; exp_continue }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EXPECT_EOF
          find . -name "*.apk" 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashCalc-Android
          path: |
            **/*.apk
          retention-days: 30
          if-no-files-found: error
